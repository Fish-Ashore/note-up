      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" rx="20" fill="url(#bg)"/>
  <text x="320" y="58" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#1e293b">Note-Up 发布链路</text>
  <g font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">
    <rect x="36" y="104" width="140" height="72" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="106" y="135" fill="#312e81" font-weight="600">Obsidian Vault</text>
    <text x="106" y="158" fill="#64748b">源文件</text>

    <rect x="250" y="104" width="140" height="72" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="320" y="135" fill="#0c4a6e" font-weight="600">Spring Boot</text>
    <text x="320" y="158" fill="#64748b">索引 + API</text>

    <rect x="464" y="104" width="140" height="72" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="534" y="135" fill="#065f46" font-weight="600">Vue 3</text>
    <text x="534" y="158" fill="#64748b">阅读 + 评论</text>

    <rect x="250" y="222" width="140" height="56" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
